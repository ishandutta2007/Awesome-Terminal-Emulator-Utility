<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters for Glow & Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes pulse-orb {
        0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
        50% { transform: scale(1.12) translate(15px, -10px); opacity: 0.55; }
      }
      @keyframes float-grid {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }
      @keyframes cursor-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes line-glow {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.8; }
      }
      .orb-1 { animation: pulse-orb 8s ease-in-out infinite; transform-origin: center; }
      .orb-2 { animation: pulse-orb 10s ease-in-out infinite reverse; transform-origin: center; }
      .cursor { animation: cursor-blink 1s step-end infinite; }
      .grid-bg { animation: float-grid 6s ease-in-out infinite; }
      .glow-line { animation: line-glow 4s ease-in-out infinite; }
      
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .code-prompt {
        font-family: "Cascadia Code", "Fira Code", "JetBrains Mono", Consolas, monospace;
        font-size: 15px;
        fill: #38bdf8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        font-weight: 600;
        fill: #e2e8f0;
      }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Dynamic Background Orbs -->
  <circle class="orb-1" cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.25" filter="url(#glow)" />
  <circle class="orb-2" cx="1000" cy="280" r="160" fill="#a855f7" opacity="0.2" filter="url(#glow)" />
  <circle class="orb-1" cx="600" cy="300" r="120" fill="#06b6d4" opacity="0.15" filter="url(#glow)" />

  <!-- Background Tech Mesh Grid Pattern -->
  <g class="grid-bg" opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" />
    <path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360" />
  </g>

  <!-- Subtle Border Highlight -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="url(#accent-cyan)" stroke-width="1.5" opacity="0.4" />

  <!-- Simulated Terminal Window Graphic (Right Side Background Element) -->
  <g transform="translate(680, 50)" filter="url(#shadow)">
    <!-- Window Outer Shell -->
    <rect width="470" height="260" rx="10" fill="url(#card-grad)" stroke="#30363d" stroke-width="1.5" />
    
    <!-- Titlebar Buttons -->
    <circle cx="20" cy="20" r="6" fill="#ff5f56" />
    <circle cx="40" cy="20" r="6" fill="#ffbd2e" />
    <circle cx="60" cy="20" r="6" fill="#27c93f" />
    <text x="235" y="24" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#8b949e">~ / awesome-terminal-tools</text>
    <line x1="0" y1="38" x2="470" y2="38" stroke="#30363d" stroke-width="1" />

    <!-- Terminal Content Lines -->
    <text x="20" y="70" class="code-prompt">❯ starship init zsh | source</text>
    <text x="20" y="98" class="code-prompt">❯ zoxide init zsh --cmd z</text>
    <text x="20" y="126" class="code-prompt">❯ fzf --preview 'bat --color=always {}'</text>
    <text x="20" y="154" class="code-prompt">❯ lazygit --version <tspan fill="#a3e635">v0.40.2</tspan></text>
    <text x="20" y="182" class="code-prompt">❯ eza --long --header --icons</text>
    <text x="20" y="210" class="code-prompt">❯ btop --preset 1</text>
    <text x="20" y="238" class="code-prompt">❯ Warp / iTerm2 / Zellij / Atuin <tspan class="cursor" fill="#38bdf8">█</tspan></text>
  </g>

  <!-- Foreground Content Container (Ensures Title and Subtitle are clear & unblocked) -->
  <g transform="translate(60, 60)">
    <!-- Category Pill Tag -->
    <rect x="0" y="0" width="230" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <text x="15" y="19" class="badge-text" fill="#38bdf8">⚡ CURATED AWESOME LIST</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title-text" filter="url(#shadow)">
      Awesome Terminal
    </text>
    <text x="0" y="135" class="title-text" fill="url(#accent-cyan)">
      Emulator Utility 🚀
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="178" class="subtitle-text">
      Ecosystem of Top SaaS Platforms, Terminal Emulators,
    </text>
    <text x="0" y="204" class="subtitle-text">
      CLI Productivity Tools &amp; Open-Source Shell Extensions
    </text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(0, 230)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="32" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="14" y="20" class="badge-text" fill="#a3e635">🖥️  Emulators</text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="135" height="32" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="159" y="20" class="badge-text" fill="#38bdf8">🐚  Shell Tools</text>

      <!-- Pill 3 -->
      <rect x="290" y="0" width="145" height="32" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="304" y="20" class="badge-text" fill="#c084fc">📊  TUI Monitors</text>
    </g>
  </g>
</svg>
